name: aimc-self-host

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: supabase/postgres:17.6.1.136@sha256:f371b5f3f2ac0a05703f33d6e6134515fb2498cab708fb948a0aeb7481467c00
    restart: unless-stopped
    mem_limit: ${DB_MEMORY_LIMIT:-2048m}
    shm_size: 256m
    pids_limit: 128
    logging: *logging
    networks: [database]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate a private environment file first}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: "5432"
      POSTGRES_PORT: "5432"
      JWT_EXP: "3600"
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=50
      - -c
      - cron.launch_active_jobs=off
    volumes:
      - ${AIMC_STATE_DIR:?Set the state directory outside the repository}/database:/var/lib/postgresql/data
      - database-config:/etc/postgresql-custom
      - ./upstream/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./upstream/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:ro
      - ./upstream/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres]
      interval: 10s
      timeout: 5s
      retries: 12

  auth:
    image: supabase/gotrue:v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    logging: *logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database, application]
    depends_on:
      db: { condition: service_healthy }
      gateway: { condition: service_started }
    env_file: ${AIMC_RUNTIME_DIR:?Set the private runtime directory}/auth-templates.env
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: https://${API_HOST:?Set the API hostname}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: https://${SITE_HOST:-aimarketcap.tech}
      GOTRUE_URI_ALLOW_LIST: https://${SITE_HOST:-aimarketcap.tech}/auth/callback,https://${SITE_HOST:-aimarketcap.tech}/reset-password
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Generate new signing keys}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_ISSUER: https://${API_HOST}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: "10"
      GOTRUE_SMTP_HOST: ${SMTP_HOST:?Copy the existing SMTP configuration}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-465}
      GOTRUE_SMTP_USER: ${SMTP_USER:?Set the SMTP user}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:?Set the SMTP credential}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-support@aimarketcap.tech}
      GOTRUE_SMTP_SENDER_NAME: AI Market Cap
      GOTRUE_SMTP_MAX_FREQUENCY: 60s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "20"
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: https://${API_HOST}/auth/v1/callback
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:9999/health]
      interval: 10s
      timeout: 5s
      retries: 6

  rest:
    image: postgrest/postgrest:v14.18@sha256:c7cd7e265a85b05248abf53f4473fcec7e327c282d0bd0cf60f1551996d09fcf
    restart: unless-stopped
    mem_limit: 192m
    pids_limit: 128
    logging: *logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [database]
    volumes:
      - ./rest-health.conf:/etc/postgrest-health.conf:ro
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_POOL: "10"
      PGRST_DB_MAX_ROWS: "1000"
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_SERVER_PORT: "3000"
      PGRST_ADMIN_SERVER_PORT: "3001"
    healthcheck:
      test: [CMD, postgrest, /etc/postgrest-health.conf, --ready]
      interval: 10s
      timeout: 5s
      retries: 6

  web:
    image: ${AIMC_APP_IMAGE:?Use an image built and tested outside the VPS}
    restart: unless-stopped
    mem_limit: ${WEB_MEMORY_LIMIT:-2560m}
    pids_limit: 256
    logging: *logging
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [application]
    env_file: ${AIMC_RUNTIME_DIR}/application.env
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=1536
      NEXT_PUBLIC_SITE_URL: https://${SITE_HOST:-aimarketcap.tech}
      NEXT_PUBLIC_SUPABASE_URL: https://${API_HOST}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?Generate the API keys}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?Generate the API keys}
      CRON_RUNNER_MODE: external
      RATE_LIMIT_BACKEND: database
    depends_on:
      auth: { condition: service_healthy }
      rest: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

  gateway:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    logging: *logging
    security_opt: [no-new-privileges:true]
    networks:
      database:
      application:
        aliases: ["${API_HOST}"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_HOST: ${API_HOST}
      SITE_HOST: ${SITE_HOST:-aimarketcap.tech}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
      ANON_KEY: ${ANON_KEY}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AIMC_RUNTIME_DIR}/auth-emails:/emails:ro
      - ${AIMC_STATE_DIR}/caddy-data:/data
      - ${AIMC_STATE_DIR}/caddy-config:/config

networks:
  database:
    internal: true
  application:

volumes:
  database-config:

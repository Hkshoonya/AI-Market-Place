name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run audit:production
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npx wrangler types cloudflare/uptime-monitor/worker-configuration.d.ts -c cloudflare/uptime-monitor/wrangler.jsonc --env-file cloudflare/uptime-monitor/.env.example --strict-vars=false
      - run: npx tsc -p cloudflare/uptime-monitor/tsconfig.json
      - run: npx wrangler types cloudflare/service-fallback/worker-configuration.d.ts -c cloudflare/service-fallback/wrangler.jsonc
      - run: npx tsc -p cloudflare/service-fallback/tsconfig.json

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: node --test scripts/self-host/*.test.mjs
      - run: node --test cloudflare/uptime-monitor/src/recovery.test.mjs
      - run: node --test cloudflare/service-fallback/src/fallback.test.mjs
      - run: npm run test:unit
      - run: npm run test:component

  database:
    name: Database IO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/test-database-io.sh
      - run: bash scripts/test-profile-privacy.sh

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: 'http://localhost:54321'
      NEXT_PUBLIC_SUPABASE_ANON_KEY: 'test-anon-key'
      NEXT_PUBLIC_E2E_MSW: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox
      - name: Build app for E2E
        run: npm run build
      - name: Run E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_PORT: '3000'
          PLAYWRIGHT_BASE_URL: 'http://127.0.0.1:3000'
          PLAYWRIGHT_WEB_SERVER_COMMAND: PORT=3000 HOSTNAME=127.0.0.1 npm run start
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: playwright-results/
          retention-days: 7
